services:
  calculator-api:
    build: .
    image: ${DOCKER_USER:-local}/calculator-api:${BUILD_NUMBER:-latest}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - calc-network
    restart: always

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator-api:
        condition: service_healthy
    networks:
      - calc-network

networks:
  calc-network:
    driver: bridge
